x-service-defaults: &service-defaults
  platform: linux/amd64
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8080/q/health/ready"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 60s

# CVE-2026-114938 mitigation for third-party JVM images (our services carry it in Dockerfile.jvm);
# drop once those images ship a fixed JDK.
x-jvm-cve-mitigation: &jvm-cve-mitigation
  JAVA_TOOL_OPTIONS: "-XX:-UseBASE64Intrinsics"

x-service-default-env: &service-default-env
  QUARKUS_PROFILE: ${QUARKUS_PROFILE}
  ELN_API_SECRET: secret
  QUARKUS_OIDC_AUTH_SERVER_URL: "http://keycloak:8080/realms/indigo-eln"
  QUARKUS_OIDC_CLIENT_ID: indigo-eln-client
  QUARKUS_OIDC_DISCOVERY_ENABLED: "false"
  QUARKUS_OIDC_JWKS_PATH: "protocol/openid-connect/certs"
  QUARKUS_OIDC_TOKEN_ISSUER: "any"
  QUARKUS_TLS_TRUST_ALL: true
  QUARKUS_LOG_CONSOLE_JSON_ENABLED: "false"
  QUARKUS_LOG_LEVEL: INFO # DEBUG
  # QUARKUS_REST_CLIENT_LOGGING_SCOPE: "request-response"
  # QUARKUS_REST_CLIENT_LOGGING_BODY_LIMIT: "9999"
  # QUARKUS_REST_CLIENT_EXTENSIONS_API_SCOPE: "all"
  # JAVA_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005 -Dquarkus.profile=dev"

services:

  postgres:
    image: "${POSTGRES_IMAGE:-public.ecr.aws/m5k0g6n7/indigoeln/postgres-combined:3.0.0}"
    platform: linux/amd64
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      start_period: 60s
      interval: 10s
      retries: 3
      start_interval: 1s

  frontend:
    # Keycloak settings are baked in at build time: VITE_AUTH_PROVIDER=keycloak,
    # VITE_KEYCLOAK_URL=http://localhost:8088, VITE_KEYCLOAK_REALM=indigo-eln,
    # VITE_KEYCLOAK_CLIENT_ID=frontend-client (see deployment-aws/codebuild/frontend-build.yaml).
    image: "${FRONTEND_IMAGE:-public.ecr.aws/m5k0g6n7/indigoeln/frontend:3.0.0}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  eln-service:
    <<: *service-defaults
    image: "${ELN_SERVICE_IMAGE:-public.ecr.aws/m5k0g6n7/indigoeln/eln-service:3.0.0}"
    environment:
      <<: *service-default-env
      QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://postgres:5432/eln"
      QUARKUS_DATASOURCE_USERNAME: eln
      QUARKUS_DATASOURCE_PASSWORD: eln
      QUARKUS_REST_CLIENT_SIGNATURE_API_URL: "http://nginx:80/"
      QUARKUS_REST_CLIENT_REPORTS_API_URL: "http://nginx:80/"
      QUARKUS_REST_CLIENT_SAMPLEREGISTRATION_API_URL: "http://nginx:80/"
      QUARKUS_LOG_CONSOLE_FORMAT: "[ELN] %d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n"
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      keycloak-config-cli:
        condition: service_completed_successfully
    ports:
      - "10020:8080"
#      - "10021:5005"

  reports-service:
    <<: *service-defaults
    image: "${REPORTS_SERVICE_IMAGE:-public.ecr.aws/m5k0g6n7/indigoeln/reports-service:3.0.0}"
    environment:
      <<: *service-default-env
      QUARKUS_LOG_CONSOLE_FORMAT: "[REPORTS] %d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n"
    ports:
      - "10040:8080"
  #      - "10041:5007"

  signature-service:
    <<: *service-defaults
    image: "${SIGNATURE_SERVICE_IMAGE:-public.ecr.aws/m5k0g6n7/indigoeln/signature-service:3.0.0}"
    environment:
      <<: *service-default-env
      QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://postgres:5432/signature"
      QUARKUS_DATASOURCE_USERNAME: signature
      QUARKUS_DATASOURCE_PASSWORD: signature
      QUARKUS_REST_CLIENT_ELN_INTERNAL_API_URL: "http://nginx:80/"
      QUARKUS_LOG_CONSOLE_FORMAT: "[SIGNATURE] %d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n"
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      keycloak-config-cli:
        condition: service_completed_successfully
    ports:
      - "10030:8080"
#      - "10031:5006"

  sampleregistration-service:
    <<: *service-defaults
    image: "${SAMPLEREGISTRATION_SERVICE_IMAGE:-public.ecr.aws/m5k0g6n7/indigoeln/sampleregistration-service:3.0.0}"
    platform: linux/amd64
    environment:
      <<: *service-default-env
      QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://postgres:5432/sampleregistration"
      QUARKUS_DATASOURCE_USERNAME: sampleregistration
      QUARKUS_DATASOURCE_PASSWORD: sampleregistration
      QUARKUS_LOG_CONSOLE_FORMAT: "[SAMPLEREGISTRATION] %d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n"
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      keycloak-config-cli:
        condition: service_completed_successfully
    ports:
      - "10050:8080"
  #      - "10021:5005"

  keycloak:
    image: keycloak/keycloak:26.5.6
    command: start-dev --health-enabled=true --log-level=ERROR 
    environment:
      <<: *jvm-cve-mitigation
      KC_DB: postgres
      KC_HOSTNAME: localhost
      KC_DB_URL: "jdbc:postgresql://postgres:5432/keycloak"
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HTTP_ENABLED: true
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_MANAGEMENT_PORT: 9005
      KC_HTTP_MANAGEMENT_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    ports:
      - "8088:8080"
      - "9005:9005"

  keycloak-healthcheck:
    image: alpine:latest
    depends_on:
      - keycloak
    entrypoint: >
      /bin/sh -c "
      while ! wget -q -O- http://keycloak:9005/health/started; do
        echo waiting for keycloak;
        sleep 1;
      done;
      echo keycloak is up;
      tail -f /dev/null      
      "
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://keycloak:9005/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5

  keycloak-config-cli:
    image: quay.io/adorsys/keycloak-config-cli:6.4.0-26.1.0
    depends_on:
      - keycloak-healthcheck
    environment:
      <<: *jvm-cve-mitigation
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: admin
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: true
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 150s
      IMPORT_VARSUBSTITUTION_ENABLED : true
      IMPORT_FILES_LOCATIONS: '/config/realm-config.json'
    volumes:
      - ./keycloak-config-cli/realm-config.json:/config/realm-config.json

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - eln-service
      - signature-service
      - reports-service
      - sampleregistration-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
